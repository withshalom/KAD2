KAD 2.0.0 changelog

# Changelog

This is the changelog of the rebuilt KAD, which starts at 2.0.0 because the earlier single-file KAD ended at 1.4.3. It lists what the application can do, not every change that led here. The history of the earlier KAD is in its own changelog (inside that application), which is the regression reference for this build: a behaviour listed there is a behaviour to bring over or to drop on purpose.

Versions follow [Semantic Versioning](https://semver.org/). Public API and `.kad` format compatibility are what a major version protects.

## 2.0.0

A new engine and a new interface, built from scratch in plain ES modules with no runtime dependencies.

### Architecture
- The CAD engine and the interface are separate. The interface reaches the engine only through its single public entry point, and a boundary checker enforces that.
- The engine has no DOM, network, `eval` or dynamic imports, so it runs the same in a browser tab, a Worker or Node.
- Every read or change of a drawing is a named command with strictly validated arguments (42 commands). Results are frozen. The command reference is generated from the code and tested to stay current.
- Access is by capability sessions: a session can be handed fewer capabilities and tighter budgets than its parent, never more. Built for giving an AI assistant or a cloud function limited access. Includes request budgets, an audit log, dry runs, and proposals that a person approves before they apply.
- Changes are transactions with delta-based undo and redo, so large edits stay cheap to undo.

### Files
- `.kad`: read and write, version 1 of KAD's own JSON. Content the engine doesn't edit (KANVAS sheets, parts, sketch planes) passes through unchanged.
- `.dxf`: read and write (ASCII, written as R14), checked against files from a real CAD application. Reads blocks and inserts (scaled, rotated, arrayed, nested), polylines with bulges, text, ellipses, splines, hatches and dimensions. Imports can replace or merge. Every import reports what was skipped.
- `.dwg` and `.step`: the engine handles these directly, with no DXF in between. The backend interface is in place; the LibreDWG and OpenCascade WebAssembly codecs are not yet included, so these formats report "backend unavailable" until they are.

### Drawing and editing
- Draw: line, polyline, rectangle, circle, arc (three-point), bezier, text, dimension, point.
- Modify: move, copy, rotate, scale, mirror, offset, trim, extend, fillet, chamfer, measure, explode, join, close and open, array, polar array, hatch, direct edit of length, angle and radius, and grip editing.
- Layers with colour, linetype, lineweight, visibility, locking and protection. Display units in mm or inches; geometry is stored in millimetres.
- Object snaps, grid, ortho, grid snap, and typed input (a length, `x,y`, `@dx,dy`, `d<angle`) while drawing.
- A command line for typed commands.

### Interface
- Icon-only controls with a minimal layout, in five skins: auto, dark, light, blueprint, parchment.
- Touch support: an aim cursor offset above the fingertip, placing on release, two-finger pan and zoom. A phone layout with a compact bar and a side rail.
- Autosave and restore, drag and drop to open, import and export from the interface.

### Builds
- Multi-file site (`index.html` plus `src/`), a single-file build with an embedded loader (`kad.html`), and a plain single file (`KADone.html`) with ordinary inline code that needs no loader and nothing to compile.
- Build information with a SHA-256 for every output.

### Verification
- 79 unit and API tests, 40 browser checks run against the real interface in Chromium (also against the single-file builds), an architecture boundary check, and engine benchmarks. With 100,000 entities: add about 0.3 s, read DXF about 0.7 s, pick about 2 ms.

### Known limits
- DWG and STEP need their WebAssembly backends.
- Not yet brought over from the earlier KAD: Kompass, polygon, stretch, break, arc center-start-radius, the SCAD console, KANVAS, parts and KLOUD.
- Hatches and beziers have no node editing yet.
- DXF lineweights round-trip rounded to the DXF lineweight ladder, and the writer always adds layer `0`.
- A very large drawing zoomed fully out has no level-of-detail drawing.

## Before 2.0.0

The original KAD: the single-file application, versions up to and including 1.4.3. Its history is kept in that application's own changelog (click its version label in the status bar). 2.0.0 is a rebuild on a new engine, not an upgrade of that code, and it keeps the original's `.kad` format and its names (Layer_0, SOLID) so drawings carry across. The original is the reference for what still needs bringing over; see Known limits above.
